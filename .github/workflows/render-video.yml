name: Render NEXORA video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: npm run render

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: nexora-video-mp4
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 7
